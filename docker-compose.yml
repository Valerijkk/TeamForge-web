version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=teamforge
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: myteamforge/backend:latest
    container_name: backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # backend/config.py возьмёт эти значения
      - POSTGRES_DB=teamforge
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      # Опционально: CORS (на фронт по умолчанию 3000)
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      # Модуль приложения для gunicorn (backend/app.py => backend.app:app)
      - APP_MODULE=backend.app:app
      # Прод окружение
      - FLASK_ENV=production
    volumes:
      # чтобы /uploads жили вне контейнера
      - ./backend/uploads:/app/backend/uploads
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # В React CRA переменные читаются на этапе билда
        # код у тебя сейчас хардкодит http://localhost:5000, но оставлю на будущее
        REACT_APP_API_URL: "http://localhost:5000"
    image: myteamforge/frontend:latest
    container_name: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
