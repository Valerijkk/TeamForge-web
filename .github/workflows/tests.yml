name: Tests (Backend + Frontend)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

jobs:
  backend-tests:
    name: Backend tests (with Postgres + live API)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: teamforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d teamforge"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      BASE: http://localhost:5000
      DATABASE_URL: postgresql://user:pass@localhost:5432/teamforge
      FLASK_ENV: testing
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps (pg_isready, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend deps
        run: |
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; \
          elif [ -f requirements.txt ]; then pip install -r requirements.txt; \
          else echo "No requirements.txt found"; fi
          pip install pytest httpx requests

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U user && exit 0
            echo "Postgres not ready yet... ($i/30)"; sleep 2
          done
          echo "Postgres did not become ready"; exit 1

      - name: Run DB migrations (optional)
        run: |
          if [ -f backend/alembic.ini ]; then
            pip install alembic
            alembic -c backend/alembic.ini upgrade head
          else
            echo "No Alembic config — skipping migrations"
          fi

      - name: Start backend API on :5000 (in background)
        run: |
          set -e
          START_CMD="${START_CMD:-}"
          if [ -z "$START_CMD" ]; then
            if [ -f backend/app.py ]; then
              START_CMD="python backend/app.py"
            elif [ -f backend/main.py ]; then
              START_CMD="python backend/main.py"
            elif python - <<'PY'
  import importlib.util, sys
  sys.exit(0 if importlib.util.find_spec('uvicorn') else 1)
  PY
  then
  START_CMD="uvicorn backend.main:app --host 0.0.0.0 --port 5000"
  else
  if [ -f backend/wsgi.py ]; then
  START_CMD="python backend/wsgi.py"
  else
  START_CMD="flask --app backend.app:app run --host 0.0.0.0 --port 5000"
  fi
  fi
  fi
echo "Starting: $START_CMD"
  bash -lc "$START_CMD > /tmp/backend.out 2>&1 &"
  echo $! > /tmp/backend.pid

- name: Wait for API to be healthy
  env:
    BASE: ${{ env.BASE }}
  run: |
    for i in {1..60}; do
      if curl -fsS "$BASE/health" >/dev/null 2>&1 || curl -fsS "$BASE/" >/dev/null 2>&1; then
        echo "API is up"; exit 0
      fi
      echo "Waiting for API... ($i/60)"; sleep 2
    done
    echo "API did not start in time"; exit 1

- name: Run pytest (unit & integration)
  run: pytest --maxfail=1 --disable-warnings -q backend/tests

- name: Show backend logs if tests failed
  if: failure()
  run: |
    echo "---- ps aux | grep backend ----"
    ps aux | grep -iE "python.+backend|uvicorn|flask" || true
    echo "---- /tmp/backend.out ----"
    [ -f /tmp/backend.out ] && tail -n +1 /tmp/backend.out || echo "No backend logs"

frontend-ci:
  name: Frontend build & tests
  runs-on: ubuntu-latest
  if: ${{ hashFiles('frontend/package.json') != '' }}
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install deps (frontend)
      working-directory: frontend
      run: |
        if [ -f package-lock.json ]; then npm ci; else npm install; fi

    - name: Build (frontend)
      working-directory: frontend
      run: npm run build --if-present

    - name: Run frontend tests
      working-directory: frontend
      run: npm test --if-present -- --ci --reporters=default
