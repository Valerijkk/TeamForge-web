name: Tests (Backend + Frontend)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

jobs:
  backend-tests:
    name: Backend tests (with Postgres + live API)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teamforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d teamforge"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      BASE: http://localhost:5000
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamforge
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      MAIL_SUPPRESS_SEND: "1"   # не отправляем почту в CI
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps (psql, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend deps (fallback на UTF-16)
        run: |
          set -eo pipefail
          if [ -f backend/requirements.txt ]; then
            if ! pip install -r backend/requirements.txt; then
              echo "pip -r backend/requirements.txt failed — пробуем перекодировать (utf-16 -> utf-8)"
              iconv -f utf-16 -t utf-8 backend/requirements.txt > /tmp/req.txt || true
              if [ -s /tmp/req.txt ]; then
                pip install -r /tmp/req.txt
              else
                echo "Не удалось перекодировать requirements.txt — проверь кодировку файла" && exit 1
              fi
            fi
          else
            echo "No backend/requirements.txt found"
          fi
          pip install pytest requests httpx

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" && exit 0
            echo "Postgres not ready yet... ($i/30)"; sleep 2
          done
          echo "Postgres did not become ready"; exit 1

      - name: Run DB init SQL (если есть)
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          if [ -f backend/db/init.sql ]; then
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/db/init.sql
          else
            echo "No backend/db/init.sql — skipping"
          fi

      - name: Start backend API on :5000 (in background)
        run: |
          set -e
          # Запуск как модуль — в коде есть относительные импорты (from .config import Config)
          python -m backend.app > /tmp/backend.out 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for API to be healthy
        env:
          BASE: ${{ env.BASE }}
        run: |
          for i in {1..90}; do
            if curl -fsS "$BASE/healthz" >/dev/null 2>&1 || curl -fsS "$BASE/" >/dev/null 2>&1; then
              echo "API is up"; exit 0
            fi
            echo "Waiting for API... ($i/90)"; sleep 2
          done
          echo "API did not start in time"; tail -n +1 /tmp/backend.out || true; exit 1

      - name: Run pytest (unit & integration)
        run: pytest --maxfail=1 --disable-warnings -q backend/tests

      - name: Show backend logs if tests failed
        if: failure()
        run: |
          echo "---- /tmp/backend.out ----"
          [ -f /tmp/backend.out ] && tail -n +1 /tmp/backend.out || echo "No backend logs"

  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "has_frontend=true" >> $GITHUB_OUTPUT
          else
            echo "has_frontend=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: ${{ steps.detect.outputs.has_frontend == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps (frontend)
        if: ${{ steps.detect.outputs.has_frontend == 'true' }}
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build (frontend)
        if: ${{ steps.detect.outputs.has_frontend == 'true' }}
        working-directory: frontend
        run: npm run build --if-present

      - name: Run frontend tests
        if: ${{ steps.detect.outputs.has_frontend == 'true' }}
        working-directory: frontend
        run: npm test --if-present -- --ci --reporters=default
