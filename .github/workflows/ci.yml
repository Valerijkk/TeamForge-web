name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build_and_push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build images
        run: |
          docker build -t myteamforge/backend:latest ./backend
          docker build -t myteamforge/frontend:latest ./frontend

      - name: Push images
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          docker push myteamforge/backend:latest
          docker push myteamforge/frontend:latest

      - name: Deploy (placeholder)
        run: echo "Deploy commands go here (ssh/kubectl/etc)"
