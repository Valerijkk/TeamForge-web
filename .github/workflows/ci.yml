name: CI/CD Pipeline   # Название workflow для CI/CD

on:
  push:
    branches:
      - main
      - master          # Запуск на пуш в главные ветки

jobs:
  build:              # Стадия сборки
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2            # Чекаутим репозиторий
      - uses: actions/setup-node@v2          # Устанавливаем Node.js для сборки фронтенда
        with:
          node-version: '18'
      - name: Install dependencies (frontend)
        run: npm install                     # Устанавливаем зависимости фронтенда
      - name: Build frontend
        run: npm run build                   # Собираем React-приложение
      - name: Set up Python
        uses: actions/setup-python@v2        # Устанавливаем Python
        with:
          python-version: '3.x'
      - name: Install dependencies (backend)
        run: pip install -r backend/requirements.txt  # Устанавливаем зависимости бэкенда
      - name: Build backend (placeholder)
        run: echo "Backend build step"        # Заглушка для сборки бэкенда

  test:               # Стадия тестирования
    name: Test
    runs-on: ubuntu-latest
    needs: [build]    # Зависит от успешной сборки
    steps:
      - uses: actions/checkout@v2           # Чекаутим репозиторий
      - name: Run backend tests
        run: pytest --maxfail=1 --disable-warnings -q backend/tests  # Запускаем все тесты бэкенда
      - name: Run frontend tests
        run: npm test                       # Запускаем тесты фронтенда

  deploy:             # Стадия деплоя
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test]     # Зависит от успешного прохождения тестов
    steps:
      - uses: actions/checkout@v2          # Чекаутим репозиторий
      - name: Login to Container Registry
        run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin  # Логинимся в Docker Hub
      - name: Build and push Docker images
        run: |
          docker build -t myteamforge/backend:latest ./backend   # Сборка образа бэкенда
          docker build -t myteamforge/frontend:latest ./frontend # Сборка образа фронтенда
          docker push myteamforge/backend:latest                 # Отправка бэкенд-образа в репозиторий
          docker push myteamforge/frontend:latest                # Отправка фронтенд-образа
      - name: Deploy to production
        run: echo "Deploying to production server"  # Здесь могут быть реальные команды деплоя (ssh, kubectl и т.д.)
