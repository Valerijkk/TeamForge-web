name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build_and_push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: [test]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || '' }}
      DOCKERHUB_TOKEN:    ${{ secrets.DOCKERHUB_TOKEN    || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Build images
        run: |
          docker build -t myteamforge/backend:latest ./backend
          docker build -t myteamforge/frontend:latest ./frontend

      - name: Push images
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          docker push myteamforge/backend:latest
          docker push myteamforge/frontend:latest

      - name: Deploy (placeholder)
        run: echo "Deploy commands go here (ssh/kubectl/etc)"
